id: block_edit_test
version: "1.0.0"
tier: blocking
name: block_edit_test
description: Blocks editing of Edit test.md for testing rule firing
trigger:
  hook: PreToolUse
  tools: [edit, write]
check:
  condition:
    field: "tool_input"
    operator: "equals"
    pattern: "Edit test.md"
action: block_edit_test
params:
  reason: "Editing Edit test.md is blocked by test rule"
  allow_bypass: true